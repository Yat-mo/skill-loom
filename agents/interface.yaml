interface:
  display_name: "Skill Loom"
  short_description: "Research, architect, evaluate, and safely publish reusable skills end to end"
  default_prompt: "Use $skill-loom as the single skill-authoring and publishing authority. Use its built-in dual-catalog research, progressive architecture gate, trigger and route validation, and evidence-aware release flow. Build the smallest structure the recurring job earns; preserve explicit ownership and attribution. Publish only when explicitly requested, through a feature branch, PR, versioned GitHub Release, npx discovery and isolated clean install. Never push directly to main/master, never reuse a released version, and do not invoke a separate creator, discovery or publisher skill."
  examples:
    - "把这个流程整理成一个可重用、可验证的 skill"
    - "优化这个已有 skill，补 trigger eval 和发布门禁"
    - "把项目规则整理成可路由、可维护的 Codex skill"
    - "把这套 SOP、脚本和提示词封装成团队可复用的 skill 包"
    - "先找下载量高、证据强的相关 skill，再取长补短创建一个更好的 skill"
    - "迁移这个旧 skill，并检查安装入口和递归发现风险"
    - "只审计这个 skill 的路由与输出评估，先不要改文件"
    - "把这个 skill 发布到 GitHub，并完成 PR、Release 和干净安装验证"
    - "先 dry-run 检查这个 skill 是否具备安全发布条件"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills-compatible"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow catalog metadata and read-only source review; forbid unreviewed execution"
    generated_public_claims: "evidence-bound"
  permissions:
    network: "skills.sh, SkillsMP API/catalog, and source-repository discovery/review; external research when needed; publishing only when requested"
    file_write: "skill package files only unless user explicitly requests sync, publish, or install"
    subprocess: "npx --yes skills find/add, bundled resilient dual-catalog research, validation, safe Git/gh PR/Release publication, clean-install verification, and packaging scripts; no separate discovery or publisher skill"
    interactive: "avoid unless GitHub, installer, or platform auth requires it"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    agent-skills-compatible: "canonical-source"
    vscode: "neutral-source-plus-review-notes"
gates:
  scaffold:
    - "SKILL.md frontmatter"
    - "README hook and natural trigger examples"
    - "clear exclusions"
  production:
    - "skill-loom is the single authoring authority"
    - "prior-art research report or explicit missing evidence"
    - "skills.sh and SkillsMP source-separated discovery or explicit catalog unavailability"
    - "user-facing reference, lesson, rejection, advantage, and evidence handoff"
    - "generalization gate for sample-driven core changes"
    - "agents/interface.yaml"
    - "agents/openai.yaml when OpenAI/Codex is a target"
    - "progressive architecture tier is justified"
    - "evals/trigger_cases.json"
    - "scripts/validate_skill.py"
    - "install and README verification"
    - "root-only discoverable SKILL.md entrypoint"
  library:
    - "reports/skill-ir.json"
    - "portability notes"
    - "trust boundary"
  governed:
    - "output contract"
    - "trust report or explicit missing evidence"
    - "rollback boundary"
    - "public claim guard"
    - "blind-review integrity when human evidence is claimed"
    - "local, PR, and published release readiness checked by executable gates"
    - "manifest, Skill IR, trigger report, remote version, and release evidence remain consistent"
    - "bundled publisher forbids direct default-branch push and released-version reuse"
    - "README, MIT LICENSE, owner-scoped profile policy, PR discussion/check state, Release, discovery and clean install are verified"
